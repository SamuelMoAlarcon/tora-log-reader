[package]
name = "tora-log-reader"
version = "0.1.0"
edition = "2024"
description = "Leitor de logs rápido e com baixo consumo de memória para arquivos acima de 10 GB"

[lib]
name = "tora_core"
path = "src/lib.rs"

[[bin]]
name = "tora"
path = "src/main.rs"

[[bin]]
name = "tora-loggen"
path = "src/bin/tora-loggen.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
encoding_rs = "0.8.44"
memchr = "2.8.3"
regex = "1.13.1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.2.1"

[profile.release]
debug = "line-tables-only"
